<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>quote-reply browser harness</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        font: 14px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f2023;
        background: #fbfbfa;
      }
      #chat {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 16px 220px;
      }
      #chat p {
        margin: 0 0 18px;
        white-space: pre-wrap;
      }
      #composer {
        position: fixed;
        inset: auto 0 0 0;
        padding: 12px 16px 16px;
        background: #fbfbfa;
      }
      .card {
        box-sizing: border-box;
        max-width: 720px;
        margin: 0 auto;
        border: 1px solid #dcdcd8;
        border-radius: 14px;
        background: #fff;
        padding: 10px 12px 8px;
      }
      .seat {
        min-height: 44px;
        outline: none;
        padding: 6px 2px;
        white-space: pre-wrap;
      }
      .row {
        display: flex;
        justify-content: flex-end;
      }
      .send {
        border: 0;
        border-radius: 50%;
        width: 32px;
        height: 32px;
        background: #d97757;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="chat" data-conversation-region="chat">
      <p id="passage">第一段：Claude 里选中文字会浮出「引用文本」，点开就能写回复。</p>
      <p>第二段：方块按加入顺序排列，发送时每组之间空一行。</p>
      <p>第三段：回复框里的文字会在发送后清空。</p>
    </div>

    <div id="composer" data-composer-card>
      <div class="card">
        <div id="seat" class="seat" data-composer-seat contenteditable="true"></div>
        <div class="row">
          <button id="send" class="send" aria-label="发送" type="button">↑</button>
        </div>
        <div id="dock"></div>
      </div>
    </div>

    <script src="../../node_modules/react/umd/react.development.js"></script>
    <script src="../../node_modules/react-dom/umd/react-dom.development.js"></script>
    <script>
      // Minimal host stand-in: the same seams the plugin uses inside the app.
      window.__prompted = [];
      window.__submits = 0;
      window.__draft = '';

      const seat = document.getElementById('seat');
      const host = {
        subs: new Set(),
        snapshot: { text: '', attachmentIds: [] },
        publish() {
          host.snapshot = { text: window.__draft, attachmentIds: [] };
          for (const listener of [...host.subs]) listener();
        },
        subscribe(listener) {
          host.subs.add(listener);
          return () => host.subs.delete(listener);
        },
      };

      const setDraft = (text) => {
        window.__draft = text;
        seat.textContent = text === '' ? '' : text;
        host.publish();
      };

      seat.addEventListener('input', () => {
        window.__draft = seat.textContent;
        host.publish();
      });
      document.getElementById('send').addEventListener('click', () => {
        window.__submits += 1;
      });

      const session = {
        sessionId: 'browser-1',
        actions: { setDraft, submit() {}, removeAttachment() {} },
      };

      const sessionsService = {
        binding() {
          return {
            session: {
              prompt(content, mode) {
                window.__prompted.push({ content, mode });
                return Promise.resolve({ ok: true, value: { accepted: true } });
              },
            },
          };
        },
      };

      const slots = new Map();
      const ctx = {
        get(name) {
          return name === 'sessions' ? sessionsService : null;
        },
        on() {
          return () => {};
        },
        effect(callback) {
          const dispose = callback();
          return () => {
            if (typeof dispose === 'function') dispose();
          };
        },
        slots: {
          inject(name, register) {
            register();
          },
          register(config, component) {
            slots.set(config.id, component);
            return () => slots.delete(config.id);
          },
        },
      };

      window.__ModuleLoader__ = {
        load(module) {
          window.__plugin = module.factory((name) => (name === 'react' ? window.React : undefined));
          window.__plugin.apply(ctx);
        },
      };
    </script>
    <script src="../../client.js"></script>
    <script>
      const React = window.React;
      const useInput = (selector) => {
        const snapshot = React.useSyncExternalStore(
          (cb) => host.subscribe(cb),
          () => host.snapshot,
          () => host.snapshot,
        );
        return selector(snapshot);
      };
      const Overlay = slots.get('quote-reply-overlay');
      const Bridge = slots.get('quote-reply');
      ReactDOM.createRoot(document.getElementById('dock')).render(
        React.createElement(
          React.Fragment,
          null,
          React.createElement(Overlay, null),
          React.createElement(Bridge, {
            sessionId: 'browser-1',
            inputActions: session.actions,
            useInput,
          }),
        ),
      );
    </script>
  </body>
</html>
